name: 🚀 Production Deployment - InStyle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

# Prevent concurrent deployments
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '18'

jobs:
  # ========================================================================
  # JOB 1: Code Quality & Linting
  # ========================================================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run ESLint
        run: npm run lint

      - name: 🎯 Run TypeScript compiler
        run: npm run type-check

      - name: 📝 Check code formatting
        run: npm run format:check

  # ========================================================================
  # JOB 2: Security Scanning
  # ========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛡️ Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: 🔐 Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: 🚨 Run CodeQL analysis
        uses: github/codeql-action/init@v2
        with:
          languages: typescript, javascript

      - name: 🔬 Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2

      - name: 🔑 Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ========================================================================
  # JOB 3: Unit & Integration Tests
  # ========================================================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test:unit -- --coverage

      - name: 🔗 Run integration tests
        run: npm run test:integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  # ========================================================================
  # JOB 4: Build Application
  # ========================================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [quality, security, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: .next
          retention-days: 1

  # ========================================================================
  # JOB 5: Database Migration (Dry Run)
  # ========================================================================
  db-migration:
    name: 🗄️ Database Migration Check
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for migration files
        run: |
          if [ -d "supabase/migrations" ]; then
            echo "✅ Migration files found"
            ls -la supabase/migrations/
          else
            echo "⚠️ No migration files"
          fi

  # ========================================================================
  # JOB 6: Deploy to Production
  # ========================================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, db-migration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: .next

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: ✉️ Send deployment notification
        run: |
          curl -X POST ${{ secrets.WHATSAPP_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "message": "✅ InStyle SaaS Platform deployed successfully!\n🚀 Version: ${{ github.sha }}\n🔗 https://instylehairboutique.co.za\n⏰ Deployed at: $(date)",
              "phone": "${{ secrets.ADMIN_PHONE }}"
            }'
        continue-on-error: true
