name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, fix/build-errors]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Run codegen
        run: npm run codegen
      - name: Build
        run: npm run build
      - name: Check manifests
        run: |
          echo "Manifests:"
          find .next -type f -name "*manifest*" -print
