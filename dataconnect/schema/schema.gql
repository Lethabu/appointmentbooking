type Tenant @table {
  name: String!
  createdAt: Timestamp!
  subscriptionStatus: String!
  logoUrl: String
  contactEmail: String
  phoneNumber: String
  address: String
}

type Service @table {
  tenant: Tenant!
  name: String!
  durationMinutes: Int!
  price: Float!
  createdAt: Timestamp!
  description: String
}

type StaffMember @table {
  tenant: Tenant!
  firstName: String!
  lastName: String!
  createdAt: Timestamp!
  email: String
  phoneNumber: String
  bio: String
}

type AvailabilitySlot @table {
  staffMember: StaffMember!
  tenant: Tenant!
  startTime: String!
  endTime: String!
  date: Date!
  createdAt: Timestamp!
}

type Customer @table {
  email: String!
  firstName: String!
  lastName: String!
  createdAt: Timestamp!
  phoneNumber: String
}

type Appointment @table {
  tenant: Tenant!
  service: Service!
  staffMember: StaffMember!
  customer: Customer!
  startTime: String!
  endTime: String!
  date: Date!
  status: String!
  createdAt: Timestamp!
  notes: String
}