<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instyle Theme Feedback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
    }
    .survey-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .rating {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .rating input {
      display: none;
    }
    .rating label {
      font-size: 2.5rem;
      color: #ddd;
      cursor: pointer;
      padding: 0 0.25rem;
    }
    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: #f5b301;
    }
    .rating input:checked + label ~ label {
      color: #ddd;
    }
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background-color: #007aff;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #005ecb;
    }
  </style>
</head>
<body>

  <div class="survey-container">
    <h1>We'd love your feedback on the new theme!</h1>
    <form action="#" method="POST">
      <p>How would you rate the new AI-generated theme for Instyle Hair Boutique?</p>
      <div class="rating">
        <input type="radio" id="star5" name="rating" value="5" /><label for="star5">&#9733;</label>
        <input type="radio" id="star4" name="rating" value="4" /><label for="star4">&#9733;</label>
        <input type="radio" id="star3" name="rating" value="3" /><label for="star3">&#9733;</label>
        <input type="radio" id="star2" name="rating" value="2" /><label for="star2">&#9733;</label>
        <input type="radio" id="star1" name="rating" value="1" /><label for="star1">&#9733;</label>
      </div>
      <p>Any additional comments or suggestions?</p>
      <textarea name="feedback" rows="5" placeholder="Your feedback..."></textarea>
      <button type="submit">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
